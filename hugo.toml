baseURL = 'https://sighery.com/'
languageCode = 'en-001'
title = 'Rincon'
theme = 'simplex'
copyright = '© 2025 Sighery'

disableKinds = ['taxonomy', 'term', 'sitemap']

[module]
  [[module.mounts]]
    disableWatch = false
    lang = ''
    source = 'content'
    target = 'content'
    excludeFiles = [
      '**/*.excalidraw'
    ]

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  [[menus.main]]
    name = 'RSS'
    # pageRef won't link it
    url = '/index.xml'
    weight = 20

[taxonomies]
  serie = 'series'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true

  [markup.highlight]
    style = 'monokai'
    hl_inline = false
    noClasses = false
    tabWidth = 4
    wrapperClass = 'highlight'
