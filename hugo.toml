baseURL = 'https://sighery.com/'
languageCode = 'en-001'
title = 'Rincon'
theme = 'simplex'

disableKinds = ['taxonomy', 'term']

[module]
  [[module.mounts]]
    disableWatch = false
    lang = ''
    source = 'content'
    target = 'content'
    excludeFiles = [
      "**/*.excalidraw"
    ]

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10

  # [[menus.main]]
  #   name = 'Posts'
  #   pageRef = '/posts'
  #   weight = 20

  # [[menus.main]]
  #   name = 'Series'
  #   pageRef = '/series'
  #   weight = 30

[taxonomies]
  serie = 'series'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true

  [markup.highlight]
    style = 'monokai'
    hl_inline = false
    noClasses = false
    tabWidth = 4
    wrapperClass = 'highlight'
